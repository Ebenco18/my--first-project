<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mama Gold Admin FIX</title>
<style>body{background:#fff8e7;font-family:Arial;padding:12px}.box{max-width:550px;margin:auto;background:white;border:4px solid #8B4513;border-radius:15px;padding:18px}button{padding:10px;border:none;border-radius:8px;font-weight:bold}.mainBtn{width:100%;padding:14px;background:#8B4513;color:gold;font-size:16px;margin-top:10px}.item{border:2px solid #8B4513;border-radius:10px;padding:10px;margin-bottom:10px;background:#fff8e7}</style></head>
<body><div class="box"><h2 style="text-align:center;color:#8B4513">🍛 MAMA GOLD ADMIN - FIXED</h2>
<input id="name" placeholder="Food Name" style="width:100%;padding:10px;margin-top:8px;border-radius:8px;border:2px solid #ccc"><input id="price" type="number" placeholder="Price" style="width:100%;padding:10px;margin-top:8px;border-radius:8px;border:2px solid #ccc"><input id="desc" placeholder="Desc" style="width:100%;padding:10px;margin-top:8px;border-radius:8px;border:2px solid #ccc"><input type="file" id="file" accept="image/*" style="margin-top:8px"><img id="preview" style="width:100%;height:180px;object-fit:cover;display:none;border-radius:10px;margin-top:8px;border:3px solid gold"><div id="sizeInfo" style="font-size:11px;text-align:center"></div><button class="mainBtn" onclick="saveAll()" id="btn">Save Food (Photo go show forever!)</button><div id="msg" style="text-align:center;margin-top:8px"></div><div style="margin-top:20px;border-top:3px solid gold;padding-top:10px"><h3>Menu</h3><div id="list">Loading...</div></div></div>
<script>
const SCRIPT_URL="https://script.google.com/macros/s/AKfycbxmvMIC2QPoGEp-zDC_ksVFMkb0eFhZTid2vzaOoCRX3pkbmzUWS4C5daoMYkARwPMM/exec";
if(prompt("PIN:")!=="1234"){document.body.innerHTML="<h2>Denied</h2>"}
let finalBase64="",editMode=null;
function toBase64(file){return new Promise(res=>{let r=new FileReader();r.onload=e=>{let img=new Image();img.onload=()=>{let c=document.createElement('canvas');let maxW=500;let ratio=Math.min(maxW/img.width,maxW/img.height);c.width=img.width*ratio;c.height=img.height*ratio;c.getContext('2d').drawImage(img,0,0,c.width,c.height);let b64=c.toDataURL('image/jpeg',0.5);res(b64)};img.src=e.target.result};r.readAsDataURL(file)})}
document.getElementById('file').addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;document.getElementById('msg').innerText="Compressing...";let b64=await toBase64(file);finalBase64=b64;document.getElementById('preview').src=b64;document.getElementById('preview').style.display='block';document.getElementById('sizeInfo').innerText=`Compressed to ${(b64.length/1024).toFixed(0)}KB - Permanent! ✅`;document.getElementById('msg').innerText="✅ Photo ready!";});
async function saveAll(){let n=document.getElementById('name').value.trim(),p=document.getElementById('price').value.trim(),d=document.getElementById('desc').value.trim();if(!n||!p||!d){alert("Fill");return;}if(!finalBase64&&!editMode){alert("Choose photo");return;}let payload=editMode?{action:"edit",oldName:editMode,name:n,price:p,desc:d,image:finalBase64||editMode.image}:{name:n,price:p,desc:d,image:finalBase64};document.getElementById('btn').innerText="Saving...";await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(payload)});document.getElementById('msg').innerHTML="✅ Saved - Photo go show forever!";editMode=null;document.getElementById('btn').innerText="Save Food";loadList();}
async function loadList(){let r=await fetch(SCRIPT_URL);let data=await r.json();let h="";data.forEach(f=>{let isSold=f.status==="soldout";h+=`<div class="item"><div style="display:flex;gap:8px;align-items:center"><img src="${f.image}" style="width:50px;height:50px;object-fit:cover;border-radius:8px" onerror="this.style.display='none'"><div><b>${f.name}</b> - ₦${f.price} ${isSold?'<span style=color:red>SOLD OUT</span>':''}</div></div><div style="display:flex;gap:5px;margin-top:5px"><button style="background:${isSold?'green':'orange'};color:white;flex:1" onclick="toggleSold('${f.name.replace(/'/g,"\\'")}','${isSold?'available':'soldout'}')">${isSold?'Available':'SoldOut'}</button><button style="background:red;color:white" onclick="delFood('${f.name.replace(/'/g,"\\'")}')">Del</button></div></div>`});document.getElementById('list').innerHTML=h||"No food";}
async function toggleSold(name,status){await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:"soldout",name,status})});loadList();}async function delFood(name){if(!confirm("Delete "+name+"?"))return;await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({action:"delete",name})});loadList();}loadList();
</script></body></html>
