<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mama Gold Admin</title><style>body{background:#fff8e7;font-family:Arial;padding:12px}.box{max-width:500px;margin:auto;background:#fff;border:4px solid #8B4513;border-radius:15px;padding:15px}button{width:100%;padding:14px;background:#8B4513;color:gold;border:none;border-radius:10px;font-weight:bold;margin-top:10px}</style></head><body><div class="box"><h2 style="text-align:center;color:#8B4513">🍛 MAMA GOLD ADMIN</h2><input id="n" placeholder="Food Name" style="width:100%;padding:10px;margin-top:8px"><input id="p" type="number" placeholder="Price 3000" style="width:100%;padding:10px;margin-top:8px"><input id="d" placeholder="Desc e.g Egg" style="width:100%;padding:10px;margin-top:8px"><input type="file" id="f" accept="image/*" style="margin-top:8px"><img id="pv" style="width:100%;height:180px;object-fit:cover;display:none;margin-top:8px;border:3px solid gold;border-radius:10px"><div id="inf" style="font-size:12px;text-align:center"></div><input id="u" readonly placeholder="Permanent link appear here" style="width:100%;padding:8px;background:#eee;margin-top:5px"><button onclick="save()" id="b">Save Food</button><div id="m" style="text-align:center"></div><div id="list" style="margin-top:15px"></div></div><script>
const API="https://script.google.com/macros/s/AKfycbxmvMIC2QPoGEp-zDC_ksVFMkb0eFhZTid2vzaOoCRX3pkbmzUWS4C5daoMYkARwPMM/exec";
if(prompt("PIN:")!=="1234"){document.body.innerHTML="Denied"}
let final="";
function comp(file){return new Promise(r=>{let rd=new FileReader();rd.onload=e=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas');let w=600;let ra=Math.min(w/im.width,w/im.height);c.width=im.width*ra;c.height=im.height*ra;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>r(b),'image/jpeg',0.6)};im.src=e.target.result};rd.readAsDataURL(file)})}
document.getElementById('f').addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;document.getElementById('inf').innerText="Compressing...";let blob=await comp(file);document.getElementById('pv').src=URL.createObjectURL(blob);document.getElementById('pv').style.display='block';document.getElementById('inf').innerText="Uploading permanent...";let fd=new FormData();fd.append('reqtype','fileupload');fd.append('fileToUpload',blob,'food.jpg');let res=await fetch('https://catbox.moe/user/api.php',{method:'POST',body:fd});final=(await res.text()).trim();document.getElementById('u').value=final;document.getElementById('m').innerText="✅ Permanent photo ready!";document.getElementById('inf').innerText="Link: "+final+" - Permanent ✅"});
async function save(){let name=document.getElementById('n').value.trim(),price=document.getElementById('p').value.trim(),desc=document.getElementById('d').value.trim(),img=document.getElementById('u').value||final;if(!name||!price||!desc||!img){alert("Fill all + wait for link");return}document.getElementById('b').innerText="Saving...";await fetch(API,{method:'POST',mode:'no-cors',body:JSON.stringify({name,price,desc,image:img})});document.getElementById('m').innerHTML="✅ "+name+" saved!";document.getElementById('b').innerText="Save Food";load();}
async function load(){let r=await fetch(API);let d=await r.json();let h="";d.forEach(f=>{h+=`<div style="border:2px solid #8B4513;border-radius:8px;padding:6px;margin-bottom:6px;display:flex;gap:6px"><img src="${f.image}" style="width:45px;height:45px;object-fit:cover;border-radius:6px"><div><b>${f.name}</b> ₦${f.price}</div></div>`});document.getElementById('list').innerHTML=h}load();
</script></body></html>
