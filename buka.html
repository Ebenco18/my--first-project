<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mama Gold Buka - Hot Food</title>
<style>
body{background:#fff8e7;font-family:Arial;margin:0;padding:12px}
.header{text-align:center;background:#8B4513;color:gold;padding:20px;border:5px solid gold;border-radius:15px;margin-bottom:15px}
.header h1{margin:0;font-size:28px}
.menu{display:grid;gap:15px}
.card{border:3px solid #8B4513;border-radius:15px;background:white;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,0.2);position:relative}
.card.soldout{opacity:0.7;border:3px dashed red}
.card img{width:100%;height:200px;object-fit:cover}
.card-body{padding:12px}
.card-body h3{margin:0;color:#8B4513;font-size:20px}
.price{color:green;font-weight:bold;font-size:20px;margin:6px 0}
.desc{color:#555;font-size:14px}
.badge{padding:7px;text-align:center;font-weight:bold;font-size:14px}
.badge.sold{background:red;color:white}
.badge.avail{background:green;color:white}
.orderBtn{display:block;width:100%;padding:12px;background:#25D366;color:white;text-align:center;text-decoration:none;border-radius:8px;margin-top:10px;font-weight:bold;font-size:16px}
.orderBtn.disabled{background:gray;pointer-events:none}
@media(min-width:600px){.menu{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="header">
<h1>🍛 MAMA GOLD BUKA 🍛</h1>
<p>🔥 Hot Food - Order on WhatsApp</p>
<p style="font-size:12px;margin-top:5px">Fresh food everyday - Ibadan</p>
</div>

<div id="menu" class="menu">Loading foods... 🍲⏳</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxmvMIC2QPoGEp-zDC_ksVFMkb0eFhZTid2vzaOoCRX3pkbmzUWS4C5daoMYkARwPMM/exec";
const WHATSAPP_NUMBER = "234XXXXXXXXXX"; // Change to Mama Gold WhatsApp number!

async function load(){
  try{
    let res = await fetch(API_URL);
    let data = await res.json();
    let html="";
    data.reverse().forEach(item=>{
      if(!item.name) return;
      let isSold = item.status === "soldout";
      let img = item.image || `https://via.placeholder.com/300x200?text=${encodeURIComponent(item.name)}`;
      let badge = isSold 
        ? `<div class="badge sold">❌ SOLD OUT - E Don Finish</div>` 
        : `<div class="badge avail">✅ AVAILABLE - Order Now</div>`;
      let btn = isSold
        ? `<a class="orderBtn disabled">Sold Out</a>`
        : `<a class="orderBtn" href="https://wa.me/${WHATSAPP_NUMBER}?text=Hello%20Mama%20Gold,%20I%20want%20to%20order%20${encodeURIComponent(item.name)}%20-%20₦${item.price}" target="_blank">Order on WhatsApp 💬</a>`;

      html+=`
        <div class="card ${isSold?'soldout':''}">
          <img src="${img}" onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'">
          ${badge}
          <div class="card-body">
            <h3>${item.name}</h3>
            <div class="price">₦${item.price}</div>
            <div class="desc">${item.desc||""}</div>
            ${btn}
          </div>
        </div>`;
    });
    if(!html) html="<p style='text-align:center;padding:20px;background:white;border-radius:10px;border:2px solid gold'>No food yet today.<br>Check back later 🍲</p>";
    document.getElementById('menu').innerHTML=html;
  }catch(e){
    document.getElementById('menu').innerHTML=`<p style='text-align:center;color:red'>Error loading menu 😢<br><small>${e}</small><br>Check internet or Apps Script</p>`;
  }
}
load();
// Refresh every 30 seconds so sold out go show quick
setInterval(load, 30000);
</script>
</body>
</html>
