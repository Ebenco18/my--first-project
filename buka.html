<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mama Gold Buka - Yaba</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Segoe UI;background:#fff8f0;color:#2d1b0e}header{background:#8B0000;color:#fff;padding:15px 20px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10}.logo{font-weight:900}.logo span{color:#ffcc00}.hero{background:linear-gradient(rgba(0,0,0,.6),rgba(0,0,0,.6)),url(https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=1200);background-size:cover;background-position:center;color:#fff;padding:80px 20px;text-align:center}.btn{padding:14px 30px;border-radius:50px;background:#ffcc00;color:#8B0000;font-weight:800;display:inline-block;margin-top:20px;text-decoration:none}.menu{padding:40px 20px;max-width:1100px;margin:0 auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px;margin-top:25px}.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.1);border:3px solid #8B0000}.card img{width:100%;height:190px;object-fit:cover}.body{padding:18px}.price{float:right;color:#8B0000;font-weight:900;font-size:1.1rem}.order{display:block;text-align:center;background:#0f172a;color:#fff;padding:12px;border-radius:12px;margin-top:14px;font-weight:700;text-decoration:none}#status{text-align:center;padding:20px;color:#8B0000;font-weight:600}</style></head><body>
<header><div class="logo">MAMA GOLD <span>BUKA</span></div><a href="https://wa.me/2349134110830" style="color:#ffcc00;text-decoration:none;font-weight:700">Order Now</a></header>
<section class="hero"><h1>Chop Better Food for Yaba, Lagos</h1><p>Live menu • Updated from Mama Gold phone</p><a href="#menu" class="btn">See Menu Today</a></section>
<section class="menu" id="menu"><h2 style="text-align:center;color:#8B0000;font-size:2.2rem">Our Menu Today</h2><div id="status">Loading fresh pot... 🍲</div><div class="grid" id="grid"></div></section>
<footer style="text-align:center;padding:35px;background:#2d1b0e;color:#ffe9c7;margin-top:40px">📍 Yaba, Lagos | Mama Gold Buka | Built by Ebenco | <a href="admin.html" style="color:#ffcc00">Admin</a></footer>
<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRcTcY_jbuiZ3ia2gjp_YJUyPEKAcNqcJsoB31Mup7KACQMoBvLdBoaUfryfVeGNOkPKatnD13FA-FZ/pub?gid=0&single=true&output=csv";
const pics=["https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600","https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=600","https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=600","https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=600"];
function cleanPrice(p){if(!p)return"₦0";let n=p.toString().replace(/[^0-9]/g,"");return n?"₦"+Number(n).toLocaleString():"₦"+p}
async function load(){
 try{
  const res=await fetch(CSV_URL);const text=await res.text();
  const rows=text.trim().split('\n').slice(1);
  const menu=rows.map((r,i)=>{const c=r.split(',');return{name:c[0]?.trim(),price:c[1]?.trim(),desc:c[2]?.trim(),img:c[3]?.trim()||pics[i%pics.length]}}).filter(m=>m.name);
  document.getElementById('status').style.display='none';
  const g=document.getElementById('grid');g.innerHTML='';
  menu.forEach((m,i)=>{
   g.innerHTML+=`<div class="card"><img src="${m.img}" onerror="this.src='${pics[i%pics.length]}'"><div class="body"><h3>${m.name} <span class="price">${cleanPrice(m.price)}</span></h3><p style="margin:10px 0;color:#8a6d5c;font-size:.92rem">${m.desc||'Freshly cooked'}</p><a class="order" href="https://wa.me/2349134110830?text=${encodeURIComponent('Hello Mama Gold, I want '+m.name+' - '+m.price)}" target="_blank">Order on WhatsApp →</a></div></div>`;
  });
 }catch(e){document.getElementById('status').innerHTML="Menu dey load... check network, but your food dey ready! 🍛";}
}
load();
</script></body></html>
